name: Release

# Production ships only from a published GitHub release. Merging to main runs the checks and nothing else;
# the `release` skill bumps the version, merges the version PR and publishes `vX.Y.Z`, and this workflow
# takes that tag to production: the desktops' image first, when `desktop/` changed since the previous
# release, then both images built from the tag's commit and one Bicep deployment of the web app and the API.
#
# The image comes first because each deployment makes its desktops from one version of it, the one it was
# deployed with: the API never runs against an image it was not released with, in either order of time.
#
# Also runs by hand to deploy any release again (a rollback).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (blank = the latest published release)
        required: false
      desktop-image:
        description: Bake the desktops' image even if desktop/ is unchanged since the previous release
        type: boolean
        default: false

permissions:
  contents: read

env:
  GROUP: workstream
  LOCATION: westus3

jobs:
  resolve:
    name: Resolve the release
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.target.outputs.deploy }}
      tag: ${{ steps.target.outputs.tag }}
      sha: ${{ steps.target.outputs.sha }}
      version: ${{ steps.target.outputs.version }}
      desktop: ${{ steps.target.outputs.desktop }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: target
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-${INPUT_TAG:-}}"
          if [ -z "$tag" ]; then
            # `gh release view` with no tag is the latest release that is neither a draft nor a prerelease.
            tag=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          fi
          if [ -z "$tag" ]; then
            echo "No published release yet; nothing to deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          flags=$(gh release view "$tag" --json isDraft,isPrerelease -q '[.isDraft, .isPrerelease] | map(tostring) | join(" ")')
          [ "$flags" = "false false" ] || { echo "::error::$tag is a draft or prerelease; only published releases deploy"; exit 1; }
          sha=$(git rev-list -n 1 "refs/tags/$tag")
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "::error::$tag ($sha) is not on main; releases are cut from main only"; exit 1; }
          version=$(git show "$sha:client/app.json" | jq -r .expo.version)
          package=$(git show "$sha:client/package.json" | jq -r .version)
          [ "$tag" = "v$version" ] \
            || { echo "::error::Tag $tag does not match client/app.json expo.version $version; fix the version PR and publish a new tag"; exit 1; }
          [ "$package" = "$version" ] \
            || { echo "::error::client/package.json version $package does not match client/app.json $version"; exit 1; }
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$sha^" 2>/dev/null || true)
          # The desktops' image is baked when what it is made from changed, and on the first release.
          desktop=true
          if [ -n "$previous" ] && git diff --quiet "$previous" "$sha" -- desktop/; then desktop=false; fi
          echo "Deploying $tag ($sha); previous release: ${previous:-none}; desktop image: $desktop"
          {
            echo "deploy=true"
            echo "tag=$tag"
            echo "sha=$sha"
            echo "version=$version"
            echo "desktop=$desktop"
          } >> "$GITHUB_OUTPUT"

  desktop-image:
    name: Desktops' image
    needs: resolve
    if: needs.resolve.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    concurrency:
      group: workstream-desktop-image
      cancel-in-progress: false
    outputs:
      version: ${{ steps.image.outputs.version }}
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      # Baked when desktop/ changed since the previous release, when the gallery has no image yet, or when
      # asked; never twice for one release. Versions 0.0.x are staging's own and do not count.
      - name: Decide whether to bake
        id: decide
        env:
          CHANGED: ${{ needs.resolve.outputs.desktop }}
          ASKED: ${{ inputs.desktop-image }}
        run: |
          set -euo pipefail
          have=$(az sig image-version list -g "$GROUP" --gallery-name workstream --gallery-image-definition machine --query "[].name" -o tsv 2>/dev/null | grep -v '^0\.0\.' || true)
          if grep -qx "$VERSION" <<<"$have"; then
            echo "Image $VERSION is already in the gallery."; echo "bake=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$have" ] || [ "$CHANGED" = true ] || [ "$ASKED" = true ]; then
            echo "bake=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop/ is unchanged since the previous release: desktops keep the image they have."; echo "bake=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/bake-desktop-image
        if: steps.decide.outputs.bake == 'true'
        with:
          version: ${{ needs.resolve.outputs.version }}
          sha: ${{ needs.resolve.outputs.sha }}
          token: ${{ github.token }}
          location: ${{ env.LOCATION }}
      - name: Keep the three newest
        if: steps.decide.outputs.bake == 'true'
        run: |
          set -euo pipefail
          az sig image-version list -g "$GROUP" --gallery-name workstream --gallery-image-definition machine \
            --query "sort_by([?!starts_with(name, '0.0.')], &publishingProfile.publishedDate)[].name" -o tsv | head -n -3 \
            | xargs -r -I{} az sig image-version delete -g "$GROUP" --gallery-name workstream --gallery-image-definition machine --gallery-image-version {}
      - name: The image this release makes its desktops from
        id: image
        run: |
          set -euo pipefail
          version=$(scripts/desktop-image-version.sh "$VERSION")
          echo "Release $VERSION makes its desktops from image $version."
          echo "version=$version" >> "$GITHUB_OUTPUT"

  deploy:
    name: Web + API (Bicep)
    needs: [resolve, desktop-image]
    if: needs.resolve.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # A brand-new installation makes its network, its container apps environment and its SQL server first.
    timeout-minutes: 90
    environment: production
    # One production deploy at a time.
    concurrency:
      group: workstream-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - uses: ./.github/actions/deploy
        with:
          sha: ${{ needs.resolve.outputs.sha }}
          tag: ${{ needs.resolve.outputs.tag }}
          release-tag: ${{ needs.resolve.outputs.tag }}
          desktop-image-version: ${{ needs.desktop-image.outputs.version }}
          administrator-email: ${{ vars.ADMINISTRATOR_EMAIL }}
          # The agents' models (infra/README.md "Models").
          model-endpoint: ${{ vars.MODEL_ENDPOINT }}
          model-key: ${{ secrets.MODEL_KEY }}
          # Workstream's GitHub App (infra/README.md "GitHub"); without it teams cannot connect GitHub.
          github-app-id: ${{ vars.GH_APP_ID }}
          github-app-slug: ${{ vars.GH_APP_SLUG }}
          github-client-id: ${{ vars.GH_APP_CLIENT_ID }}
          github-client-secret: ${{ secrets.GH_APP_CLIENT_SECRET }}
          github-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          github-webhook-secret: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
