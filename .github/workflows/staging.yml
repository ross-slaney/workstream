name: Staging

# A second copy of the product to try a change on before a release: its own database, its own two apps and
# its own desktops, on production's shared foundation (infra/main.bicep `stage`). It signs in with an email
# and a password, so nobody needs an inbox, and sends no email. Started and removed by hand; nothing else
# runs it. Remove it when you are done: it costs what its two apps and its database cost while it exists.

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deploy staging, or remove it
        type: choice
        options: [deploy, remove]
        default: deploy
      ref:
        description: Branch, tag or commit to deploy
        default: main
      desktop-image:
        description: Bake the desktops' image from this ref too (for a change under desktop/); otherwise staging uses the newest release's
        type: boolean
        default: false
      hibernate:
        description: Desktops hibernate when they are stopped (infra/README.md, "Hibernation"). Needs desktop-image too, unless a release already bakes hibernating images
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: workstream-staging
  cancel-in-progress: false

env:
  NAME: workstream-staging
  # The gallery's definition staging's desktops are made from (infra/gallery.bicep).
  DEFINITION: ${{ inputs.hibernate && 'machine-hibernate' || 'machine' }}

jobs:
  # Staging's desktops come from the newest release's image, or from an image of its own baked from the ref
  # being tried. Its own are versions 0.0.N in the same gallery: no release ever chooses one, and only the
  # newest is kept.
  desktop-image:
    name: Desktops' image
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: staging
    outputs:
      version: ${{ steps.image.outputs.version }}
    env:
      OWN: 0.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - uses: ./.github/actions/bake-desktop-image
        if: inputs.desktop-image
        with:
          version: ${{ env.OWN }}
          sha: ${{ steps.commit.outputs.sha }}
          token: ${{ github.token }}
          definition: ${{ env.DEFINITION }}
      - name: Keep only this one of staging's own
        if: inputs.desktop-image
        run: |
          set -euo pipefail
          az sig image-version list -g workstream --gallery-name workstream --gallery-image-definition "$DEFINITION" \
            --query "[?starts_with(name, '0.0.') && name != '$OWN'].name" -o tsv \
            | xargs -r -I{} az sig image-version delete -g workstream --gallery-name workstream --gallery-image-definition "$DEFINITION" --gallery-image-version {}
      - name: The image staging makes its desktops from
        id: image
        env:
          BAKED: ${{ inputs.desktop-image }}
        run: |
          set -euo pipefail
          if [ "$BAKED" = true ]; then version="$OWN"; else version=$(scripts/desktop-image-version.sh); fi
          echo "Staging makes its desktops from image $version."
          echo "version=$version" >> "$GITHUB_OUTPUT"

  deploy:
    name: Web + API (Bicep)
    needs: desktop-image
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - uses: ./.github/actions/deploy
        with:
          stage: staging
          sha: ${{ steps.commit.outputs.sha }}
          tag: staging-${{ steps.commit.outputs.sha }}
          desktop-image-version: ${{ needs.desktop-image.outputs.version }}
          desktops-hibernate: ${{ inputs.hibernate }}
          # The administrator here is a made-up address with a password (the secret ADMINISTRATOR_PASSWORD).
          administrator-email: ${{ vars.ADMINISTRATOR_EMAIL || 'admin@workstream.test' }}
          administrator-password: ${{ secrets.ADMINISTRATOR_PASSWORD }}
          model-endpoint: ${{ vars.MODEL_ENDPOINT }}
          model-key: ${{ secrets.MODEL_KEY }}
          # A GitHub OAuth client of staging's own, if it has one: a client sends people back to one address only.
          github-oauth-client-id: ${{ vars.GH_OAUTH_CLIENT_ID }}
          github-oauth-client-secret: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}

  remove:
    name: Remove staging
    if: inputs.action == 'remove'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Remove its desktops, its apps and database, and what it was allowed
        run: |
          set -euo pipefail
          for group in "$NAME" "$NAME-desktops"; do
            if [ "$(az group exists -n "$group")" = true ] && [ "$(az group show -n "$group" --query tags.managedBy -o tsv)" != bicep ]; then
              echo "::error::Refusing to delete $group: not tagged managedBy=bicep"; exit 1
            fi
          done
          # The runtime identity's roles outside its own groups (the registry, the desktops' subnet, the
          # gallery) go first: a role left on a deleted identity stays behind as an unknown principal.
          principal=$(az identity show -g "$NAME" -n "$NAME-runtime" --query principalId -o tsv 2>/dev/null || true)
          if [ -n "$principal" ]; then
            az role assignment list --all --assignee "$principal" --query "[].id" -o tsv | xargs -r -n 1 az role assignment delete --ids
          fi
          for group in "$NAME-desktops" "$NAME"; do
            if [ "$(az group exists -n "$group")" = true ]; then az group delete -n "$group" --yes; fi
          done
          # The images staging baked for itself, in either definition.
          for definition in machine machine-hibernate; do
            az sig image-version list -g workstream --gallery-name workstream --gallery-image-definition "$definition" \
              --query "[?starts_with(name, '0.0.')].name" -o tsv 2>/dev/null \
              | xargs -r -I{} az sig image-version delete -g workstream --gallery-name workstream --gallery-image-definition "$definition" --gallery-image-version {}
          done
          # The database's administrators group lives in Entra, outside any resource group.
          az ad group delete --group "$NAME-sql-admins" 2>/dev/null || true
          echo "### Staging removed" >> "$GITHUB_STEP_SUMMARY"
